{{- if eq .Values.ingress.className "traefik" }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: retry-connect-4
  namespace: {{ .Release.Namespace }}
spec:
  retry:
    attempts: 4
    initialInterval: 100ms
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: retry-connect-3
  namespace: {{ .Release.Namespace }}
spec:
  retry:
    attempts: 3
    initialInterval: 100ms
{{- end }}
