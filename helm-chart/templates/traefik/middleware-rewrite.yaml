{{- if eq .Values.ingress.className "traefik" }}
# strip-hooks: removes /hooks prefix before forwarding to hooks-receiver
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-hooks
  namespace: {{ .Release.Namespace }}
spec:
  stripPrefix:
    prefixes:
      - /hooks
---
# strip-api-v2: removes /api/v2 prefix before forwarding to public-api
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-v2
  namespace: {{ .Release.Namespace }}
spec:
  stripPrefix:
    prefixes:
      - /api/v2
---
# rewrite-plumber-pipelines: /api/v1alpha/pipelines → /pipelines
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rewrite-plumber-pipelines
  namespace: {{ .Release.Namespace }}
spec:
  replacePathRegex:
    regex: "^/api/v1alpha/pipelines(.*)"
    replacement: "/pipelines$1"
---
# rewrite-plumber-deployment-targets: /api/v1alpha/deployment_targets → /deployment_targets
